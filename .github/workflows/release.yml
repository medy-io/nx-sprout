name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Check
        run: bun run check

      - name: Match package version to tag
        run: node -e "const version = require('./package.json').version; if ('v' + version !== process.env.GITHUB_REF_NAME) { throw new Error('Tag must be v' + version); }"

  verify-nx:
    name: Verify real Nx (${{ matrix.nx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nx:
          - "23.0.0"
          - "23.2.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install project dependencies
        run: bun ci

      - name: Install Nx ${{ matrix.nx }}
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          --prefix tests/fixtures/real-nx-workspace nx@${{ matrix.nx }}

      - name: Test real Nx compatibility
        run: bun run test:integration:nx

  build:
    name: Build ${{ matrix.asset }}
    needs: [verify-version, verify-nx]
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: nx-sprout-linux-x64
          - runner: ubuntu-24.04-arm
            asset: nx-sprout-linux-arm64
          - runner: macos-15-intel
            asset: nx-sprout-darwin-x64
          - runner: macos-latest
            asset: nx-sprout-darwin-arm64
          - runner: windows-latest
            asset: nx-sprout-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Create release directory
        run: >-
          bun -e "require('node:fs').mkdirSync('release', { recursive: true })"

      - name: Build native executable
        run: bun build ./src/cli.ts --compile --minify --outfile ./release/${{ matrix.asset }}

      - name: Smoke test executable
        run: ./release/${{ matrix.asset }} --version

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release/${{ matrix.asset }}.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ matrix.asset }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ matrix.asset }}
          sbom-path: release/${{ matrix.asset }}.spdx.json

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            release/${{ matrix.asset }}
            release/${{ matrix.asset }}.spdx.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum nx-sprout-* > SHA256SUMS.txt

      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
