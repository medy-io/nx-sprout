name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun ci

      - name: Check
        run: bun run check

      - name: Build executable
        run: bun run build

      - name: Smoke test executable
        if: runner.os != 'Windows'
        run: ./dist/nx-sprout --help

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: ./dist/nx-sprout.exe --help

  real-nx:
    name: Real Nx (${{ matrix.nx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nx:
          - "23.0.0"
          - "23.2.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install project dependencies
        run: bun ci

      - name: Install Nx ${{ matrix.nx }}
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          --prefix tests/fixtures/real-nx-workspace nx@${{ matrix.nx }}

      - name: Test real Nx compatibility
        run: bun run test:integration:nx
